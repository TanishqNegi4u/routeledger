# RouteLedger web tier.
#
# Two jobs, both of them load bearing:
#   1. Serve the Vite bundle and fall back to index.html so the hand-rolled
#      History API router survives a hard refresh on /app/invoices/42.
#   2. Reverse-proxy the API on the same origin, so the browser never issues a
#      cross-origin preflight and the JWT never needs a third-party cookie.
#
# BACKEND_ORIGIN is templated at container start by docker-entrypoint.d, which
# is what lets the identical image run under docker-compose (http://backend:8080)
# and under Kubernetes (http://routeledger-api:8080) with no rebuild. nginx
# resolves that name once at startup and caches it - which is exactly right here,
# because a Service ClusterIP is stable for the life of the Service even as the
# pods behind it are replaced.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 2m;

    # Hardening headers. No CSP unsafe-inline for scripts: the bundle is external,
    # inline styles are used by React so style-src keeps 'unsafe-inline'.
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # ---- API + docs, proxied to Spring Boot -------------------------------
    location /api/ {
        proxy_pass         ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    location /actuator/ {
        proxy_pass       ${BACKEND_ORIGIN};
        proxy_set_header Host $host;
    }

    location /swagger-ui {
        proxy_pass       ${BACKEND_ORIGIN};
        proxy_set_header Host $host;
    }

    location /swagger-ui.html {
        proxy_pass       ${BACKEND_ORIGIN};
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass       ${BACKEND_ORIGIN};
        proxy_set_header Host $host;
    }

    # ---- static assets ----------------------------------------------------
    # Vite fingerprints everything under /assets, so it is safe to pin forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # Container-local probe that does not depend on the API being up.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- SPA fallback -----------------------------------------------------
    # index.html itself must never be cached, or a deploy leaves browsers
    # pointing at hashed bundles that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
