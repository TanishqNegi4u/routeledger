name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  verify:
    name: Build & Verify Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: routeledger-root
          MYSQL_DATABASE: routeledger_test
          MYSQL_USER: routeledger
          MYSQL_PASSWORD: routeledger
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven verify
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3307/routeledger_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: routeledger
          DB_PASSWORD: routeledger
        run: mvn -B clean verify
