# Stateless tiers: the API and the web bundle. Both are safe to scale, drain and
# roll, because all state lives in MySQL and every request carries its own JWT.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routeledger-api
  namespace: routeledger
  labels:
    app.kubernetes.io/name: routeledger
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: routeledger
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routeledger
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: routeledger
                    app.kubernetes.io/component: api
      # Flyway runs on startup and fails fast on a closed port, so wait for the
      # database to answer before the JVM gets a chance to crash-loop.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for routeledger-mysql:3306"
              until nc -z routeledger-mysql 3306; do sleep 2; done
              echo "mysql is accepting connections"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          # Built by `docker build -t routeledger/api:1.0.0 ./backend`. Retag to
          # your registry before applying on a remote cluster.
          image: routeledger/api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: routeledger-config
          # Secrets are pulled key by key, not with envFrom, so the root MySQL
          # password never enters this container's environment at all.
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: routeledger-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: routeledger-secrets
                  key: JWT_SECRET
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: routeledger-secrets
                  key: DEMO_PASSWORD
          # Boot includes Flyway plus, on an empty database, replaying 45 days of
          # demo history through the real services. 150s of headroom is honest.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routeledger-web
  namespace: routeledger
  labels:
    app.kubernetes.io/name: routeledger
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: routeledger
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routeledger
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: routeledger
                    app.kubernetes.io/component: web
      containers:
        - name: web
          # Built by `docker build -t routeledger/web:1.0.0 ./frontend`.
          image: routeledger/web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: routeledger-config
                  key: BACKEND_ORIGIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: routeledger-config
                  key: TZ
          # /healthz is answered by nginx itself, so a sick API never takes the
          # web tier down with it - the user gets the shell and a real error.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # A read-only root filesystem means the three paths nginx writes to
          # have to be supplied: the envsubst output, the proxy temp dirs, and
          # the pidfile in /tmp.
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
