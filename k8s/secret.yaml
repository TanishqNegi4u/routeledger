# ---------------------------------------------------------------------------
# PLACEHOLDER VALUES. These exist so `kubectl apply -k k8s/` works on a scratch
# cluster in one command. Replace them before this reaches anything real.
#
# The honest way to do it, without ever writing a secret to a git-tracked file:
#
#   kubectl -n routeledger create secret generic routeledger-secrets \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=MYSQL_ROOT_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=MYSQL_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DEMO_PASSWORD="$(openssl rand -base64 12)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# DB_PASSWORD and MYSQL_PASSWORD must match: one is how the API authenticates,
# the other is how MySQL provisions that same account.
#
# Kubernetes Secrets are base64, not encrypted. On a real cluster, enable
# encryption at rest or front this with an external secrets operator.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: routeledger-secrets
  namespace: routeledger
  labels:
    app.kubernetes.io/name: routeledger
    app.kubernetes.io/part-of: routeledger
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "replace-me-root-password"
  MYSQL_PASSWORD: "replace-me-app-password"
  DB_PASSWORD: "replace-me-app-password"
  # 32+ characters, HS256. Rotating this invalidates every issued token.
  JWT_SECRET: "replace-me-with-a-48-byte-random-signing-key-000000"
  DEMO_PASSWORD: "Demo@12345"
