# Horizontal scaling for the two stateless tiers. Needs metrics-server:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# The real load shape here is spiky and predictable - every operator generates
# their round between 04:00 and 06:00 - so the scale-up window is short and the
# scale-down window is long, to avoid thrashing during the morning peak.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: routeledger-api
  namespace: routeledger
  labels:
    app.kubernetes.io/name: routeledger
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: routeledger-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: routeledger-web
  namespace: routeledger
  labels:
    app.kubernetes.io/name: routeledger
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: routeledger-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
# Keep at least one of each tier serving during a node drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: routeledger-api
  namespace: routeledger
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: routeledger
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: routeledger-web
  namespace: routeledger
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: routeledger
      app.kubernetes.io/component: web
